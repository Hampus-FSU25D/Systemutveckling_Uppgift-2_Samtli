<script>
  document.getElementById('register-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;

    btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span>`;
    btn.disabled = true;
    btn.classList.add('opacity-70', 'cursor-not-allowed');

    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success`;
      btn.classList.replace('bg-secondary', 'bg-[#3f5d9c]'); // Using secondary color directly for visual change if needed, but sticking to design system tokens is better. Let's just change content.

      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        btn.classList.remove('opacity-70', 'cursor-not-allowed');
      }, 1500);
    }, 1000);
  });
