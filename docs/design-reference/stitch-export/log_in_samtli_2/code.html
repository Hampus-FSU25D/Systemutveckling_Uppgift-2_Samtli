<script>
  // Simple password toggle logic
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const visibilityIcon = document.getElementById('visibilityIcon');

  toggleBtn.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';

    // Slight animation effect on toggle
    visibilityIcon.classList.add('scale-75', 'opacity-50');
    setTimeout(() => {
      visibilityIcon.classList.remove('scale-75', 'opacity-50');
    }, 150);
  });

  // Form submission animation mock
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;

    btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span>`;
    btn.classList.add('opacity-80', 'cursor-not-allowed');

    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      // In a real app, redirect here
    }, 1500);
  });
