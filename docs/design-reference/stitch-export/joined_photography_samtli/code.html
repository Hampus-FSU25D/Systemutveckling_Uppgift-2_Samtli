<script>

    document.addEventListener('DOMContentLoaded', () => {

        btn.addEventListener('mouseenter', () => {
            icon.style.transform = 'translateX(4px)';
        });
        btn.addEventListener('mouseleave', () => {
            icon.style.transform = 'translateX(0)';
